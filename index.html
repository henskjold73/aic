<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIC Calendar</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0c0c0c" />
    <style>
      :root { color-scheme: dark; }
      html, body { background: #0c0c0c; color: #e6e6e6; }
      body { font-family: 'PT Sans Narrow', 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif; }
      ::selection { background: #1784d1; color: #fff; }
      /* ElvUI-style interaction: the inner edge lights up in the accent colour. */
      input:focus, textarea:focus, select:focus {
        box-shadow: inset 0 0 0 1px #1784d1 !important;
      }
      button:not(:disabled):hover { filter: brightness(1.3); }
      button:disabled { opacity: 0.45; cursor: default !important; }
      a { color: inherit; }
      button, input, select, textarea { font-family: inherit; }
      /* Thin dark scrollbars. */
      * { scrollbar-width: thin; scrollbar-color: #2c2c2c #0c0c0c; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: #0c0c0c; }
      ::-webkit-scrollbar-thumb { background: #2c2c2c; border: 1px solid #000; }
    </style>
  </head>
  <body style="margin:0;background:#0c0c0c;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
